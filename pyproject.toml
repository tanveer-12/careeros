[project]
name = "lumia"
version = "0.1.0"
description = "Local-first career intelligence and 2-week planning platform"
requires-python = ">=3.12"
dependencies = [
    # Web / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",

    # Config
    "pydantic-settings>=2.6.0",

    # HTTP + scraping
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "selectolax>=0.3.21",

    # AI / ML
    "scikit-learn>=1.6.0",
    "numpy>=2.2.0",
    "sentence-transformers>=3.0.0",

    # PDF + export
    "pypdf>=5.1.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",

    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",

    # Scheduler
    "apscheduler>=3.10.0",
]

[project.scripts]
lumia = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["core", "database", "cli", "api", "mcp_server"]